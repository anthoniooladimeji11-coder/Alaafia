  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
       background:radial-gradient(closest-side, rgba(30,230,140,0.24), rgba(30,230,140,0) 70%)}
  .mapbox{width:680px;position:relative;z-index:2}

  .caption{position:relative;z-index:2;text-align:center;margin-top:-18px}
  .caption .line1{font-family:"JetBrains Mono";font-size:15px;letter-spacing:.22em;color:#1EE68C;font-weight:500}
  .caption .line2{font-weight:600;font-size:30px;margin-top:14px;color:#DDE6E1;letter-spacing:-.005em}

  .foot{position:relative;z-index:2;border-top:1px solid #1C2420;margin-top:44px;padding-top:22px;
       display:flex;justify-content:space-between;align-items:center}
  .foot span{font-family:"JetBrains Mono";font-size:12.5px;letter-spacing:.14em;color:#4E5F57}
  .foot .brand{color:#DDE6E1}
</style>
