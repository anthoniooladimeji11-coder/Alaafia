[project]
name = "brief"
version = "0.1.0"
description = "Àlááfìa brief generator — a state's modelled indicators as a client-facing profile"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "typer>=0.12",
]

[project.scripts]
brief = "brief.__main__:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
