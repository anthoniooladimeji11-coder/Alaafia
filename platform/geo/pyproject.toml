[project]
name = "geospine"
version = "0.1.0"
description = "Àlááfìa geography spine — canonical Nigerian admin hierarchy + resolver"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
geospine = "geospine.__main__:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geospine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
